[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "early-failure-video-diffusion"
version = "0.1.0"
description = "Early failure detection and hierarchical intervention for latent video diffusion models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = [
  "LICENSE",
  "src/early_failure_video_diffusion/_vendor/viclip/LICENSE",
]
authors = [
  { name = "Kwon Byung-Ki" },
  { name = "Sohwi Lim" },
  { name = "Nam Hyeon-Woo" },
  { name = "Moon Ye-Bin" },
  { name = "Tae-Hyun Oh" },
]
dependencies = [
  "accelerate>=1.13,<2",
  "diffusers==0.38.0",
  "huggingface-hub>=0.34,<1",
  "imageio[ffmpeg]>=2.37,<3",
  "numpy>=1.26,<2",
  "Pillow>=10,<12",
  "protobuf>=4.25,<7",
  "safetensors>=0.8,<1",
  "sentencepiece>=0.2,<0.3",
  "torch>=2.5,<2.6",
  "transformers==4.57.6",
]

[project.optional-dependencies]
pipeline = [
  "einops>=0.8,<0.9",
  "ftfy>=6.2,<7",
  "openai>=1.66,<3",
  "packaging>=24,<27",
  "regex>=2024,<2027",
  "timm==1.0.12",
  "torchvision>=0.20,<0.21",
]
training = [
  "lpips>=0.1.4",
  "torchvision>=0.20,<0.21",
]
test = ["pytest>=8.0"]

[project.scripts]
early-failure-video = "early_failure_video_diffusion.cli:main"
early-failure-download-viclip = "early_failure_video_diffusion.assets:main"
early-failure-prepare-l2r = "early_failure_video_diffusion.training.prepare:main"
early-failure-init-l2r = "early_failure_video_diffusion.training.initialize:main"
early-failure-train-l2r = "early_failure_video_diffusion.training.train:main"
early-failure-fuse-l2r = "early_failure_video_diffusion.training.fuse:main"

[project.urls]
Paper = "https://arxiv.org/abs/2603.14320"
Repository = "https://github.com/kaist-ami/Early-failure-video-diffusion"
Issues = "https://github.com/kaist-ami/Early-failure-video-diffusion/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
early_failure_video_diffusion = [
  "weights/*.pt",
  "weights/*.md",
  "weights/SHA256SUMS",
  "_vendor/viclip/LICENSE",
  "_vendor/viclip/README.md",
]

[tool.ruff]
extend-exclude = ["src/early_failure_video_diffusion/_vendor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

